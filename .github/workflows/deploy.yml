name: Deploy

# Publica en un servidor propio cuando el CI de main termina bien (o a mano desde Actions).
# Solo corre si la variable del repo DEPLOY_HOST está cargada; sin ella no hace nada.
# Guía: docs/publicacion-servidor-propio.md
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  image:
    if: vars.DEPLOY_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: produccion
    env:
      SSH_HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DIR: ${{ vars.DEPLOY_DIR || '/opt/gastos' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copiar compose y Caddyfile
        run: scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh "$SSH_USER@$SSH_HOST:$DIR/"
      - name: Actualizar y reiniciar
        env:
          # El token del job alcanza para bajar la imagen; se pasa por stdin para que no quede en el servidor.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DIR'
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
          "
      - name: Verificar
        run: |
          domain=$(ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "grep -E '^DOMAIN=' '$DIR/.env' | cut -d= -f2")
          for i in $(seq 1 30); do
            if curl -fsS "https://$domain/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "La app no respondió en https://$domain/health" >&2
          exit 1
