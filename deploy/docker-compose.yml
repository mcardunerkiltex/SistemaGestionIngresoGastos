# Producción en un servidor propio. Vive en el servidor en /opt/gastos junto con .env y Caddyfile;
# el workflow "Deploy" de GitHub lo copia y actualiza la imagen en cada push a main.
# Guía: docs/publicacion-servidor-propio.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:?Falta APP_IMAGE en .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gastos:${POSTGRES_PASSWORD}@db:5432/gastos
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Falta JWT_SIGNING_KEY en .env}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  # Proxy con HTTPS automático (certificado de Let's Encrypt para DOMAIN).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
